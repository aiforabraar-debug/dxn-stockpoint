name: Verify API contracts

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run verification suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, json
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify PHP SQLite driver
        run: |
          php -r "echo extension_loaded('pdo_sqlite') ? 'pdo_sqlite OK' : 'pdo_sqlite MISSING'; echo PHP_EOL;"

      - name: Install schema into a throwaway SQLite database
        env:
          DXN_DRIVER: sqlite
          DXN_DB_PATH: ${{ github.workspace }}/api/storage/test.sqlite
          DXN_ADMIN_KEY: test-admin-key-0123456789
          DXN_INSTALL_KEY: test-install-key
          DXN_DEBUG: '1'
        run: php api/bin/install.php --pin=2468 --fresh

      - name: Run Node E2E test (55 checks)
        env:
          DXN_DRIVER: sqlite
          DXN_DB_PATH: ${{ github.workspace }}/api/storage/test.sqlite
          DXN_ADMIN_KEY: test-admin-key-0123456789
          DXN_INSTALL_KEY: test-install-key
          DXN_DEBUG: '1'
        run: node scripts/test-api.mjs

      - name: Show test diagnostics
        if: always()
        run: echo "test-api.mjs boots its own PHP server on a free port and tears it down on exit."
