name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dxn-release.jks"
          echo "DXN_KEYSTORE=$RUNNER_TEMP/dxn-release.jks" >> "$GITHUB_ENV"

      - name: Build staff app (debug + release + bundle)
        working-directory: android/DXNStockpoint
        env:
          DXN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DXN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DXN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build member app (debug + release + bundle)
        working-directory: android/DXNStockpointMember
        env:
          DXN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DXN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DXN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          set -e
          mkdir -p dist

          # Staff app
          cp android/DXNStockpoint/app/build/outputs/apk/debug/app-debug.apk \
             dist/dxn-stockpoint-2.2.0-debug.apk
          if [ -f android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk \
               dist/dxn-stockpoint-2.2.0.apk
            cp dist/dxn-stockpoint-2.2.0.apk dist/dxn-stockpoint-latest.apk
          else
            cp dist/dxn-stockpoint-2.2.0-debug.apk dist/dxn-stockpoint-latest.apk
          fi
          cp android/DXNStockpoint/app/build/outputs/bundle/release/app-release.aab \
             dist/dxn-stockpoint-2.2.0.aab

          # Member app
          cp android/DXNStockpointMember/app/build/outputs/apk/debug/app-debug.apk \
             dist/dxn-member-1.0.0-debug.apk
          if [ -f android/DXNStockpointMember/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/DXNStockpointMember/app/build/outputs/apk/release/app-release.apk \
               dist/dxn-member-1.0.0.apk
            cp dist/dxn-member-1.0.0.apk dist/dxn-member-latest.apk
          else
            cp dist/dxn-member-1.0.0-debug.apk dist/dxn-member-latest.apk
          fi
          cp android/DXNStockpointMember/app/build/outputs/bundle/release/app-release.aab \
             dist/dxn-member-1.0.0.aab

          ls -lh dist

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dxn-android-builds
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.2.0' }}
          name: DXN Stockpoint v2.2.0 — Staff + Member apps, live synced
          body: |
            ## DXN Stockpoint v2.2.0

            The PHP 8 + MySQL API is the single source of truth. The web app and both
            Android apps run from it with revision-based live sync and an offline outbox.

            **API & web app:** https://dxn.10001mb.com/ (PIN: `2468`)

            ### APKs (sideload on Android)
            - `dxn-stockpoint-2.2.0-debug.apk` — Staff / stockpoint app (admin PIN, stock, orders)
            - `dxn-member-1.0.0-debug.apk` — Member / customer app (member ID + PIN, PV balance, PV history)
            - `.aab` files are also included for Google Play upload.

            ### What is in the staff build
            - Shop PIN sign-in (HMAC bearer token, 30-day expiry)
            - Native InfinityFree challenge solver
            - Offline-first: cached catalogue, queued sales, automatic replay
            - Idempotent orders (`client_uuid`) — a retry never double-books
            - Stock ledger, low-stock alerts, dashboard, CSV exports

            ### What is in the member build
            - Member ID + PIN login (separate from shop admin PIN)
            - PV balance and total spent
            - PV distribution history with reasons and references
            - Logout / change PIN

          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
