name: Deploy API + web app (InfinityFree)

# The PHP API is the single source of truth for both clients. This workflow
# lints it on every push and mirrors it over FTP on main into the InfinityFree
# document root for dxn.10001mb.com.
#
# Required repository secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   DB_HOST, DB_NAME, DB_USER, DB_PASS
#   DXN_ADMIN_KEY, DXN_INSTALL_KEY, DXN_TOKEN_SECRET
#
# Resulting endpoints: https://dxn.10001mb.com/api/v1/...

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'docs/**'
      - 'scripts/production-install.mjs'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    paths:
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & boot the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, json
          coverage: none

      - name: Syntax-check every PHP file
        run: |
          set -e
          find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files parse cleanly."

      - name: Install schema into a throwaway SQLite database
        env:
          DXN_DRIVER: sqlite
          DXN_DB_PATH: ${{ github.workspace }}/api/storage/ci.sqlite
        run: php api/bin/install.php --pin=4242

      - name: Verify migration preserves inventory and order history
        env:
          DXN_DRIVER: sqlite
          DXN_DB_PATH: ${{ github.workspace }}/api/storage/ci.sqlite
        run: php scripts/test-catalog-migration.php

      - name: Boot the API and smoke-test the public surface
        env:
          DXN_DRIVER: sqlite
          DXN_DB_PATH: ${{ github.workspace }}/api/storage/ci.sqlite
          DXN_ADMIN_KEY: ci-admin-key-0123456789
        run: |
          set -e
          php -S 127.0.0.1:8099 -t api/public api/public/index.php > /tmp/php.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/v1/health > /dev/null && break
            sleep 1
          done

          php -r '
            $base = "http://127.0.0.1:8099/api/v1";
            $fail = 0;
            $check = function (string $name, bool $ok) use (&$fail) {
                echo ($ok ? "  ok   " : "  FAIL ") . $name . PHP_EOL;
                if (!$ok) { $fail++; }
            };
            $get = function (string $path) use ($base) {
                $raw = @file_get_contents($base . $path);
                return $raw === false ? null : json_decode($raw, true);
            };

            $health = $get("/health");
            $check("health returns success", is_array($health) && ($health["success"] ?? false) === true);
            $check("health reports version 2.2.0", ($health["version"] ?? null) === "2.2.0");

            $products = $get("/products");
            $check("catalogue is public", is_array($products) && ($products["success"] ?? false) === true);
            $catalogRows = $products["products"] ?? [];
            $check("catalogue has exactly 51 active products", count($catalogRows) === 51);
            $check("catalogue SKUs are unique", count(array_unique(array_column($catalogRows, "sku"))) === 51);

            $offlineCandidates = array_values(array_filter($catalogRows, static fn (array $product): bool => (int) ($product["stock_qty"] ?? 0) > 0));
            $offlineProduct = $offlineCandidates[0] ?? [];
            $offlineBody = @file_get_contents($base . "/orders", false, stream_context_create([
                "http" => [
                    "method" => "POST",
                    "header" => "Content-Type: application/json\r\n",
                    "content" => json_encode([
                        "client_uuid" => "ci-offline-sku-replay-2-1-2",
                        "customer_name" => "CI offline SKU replay",
                        "is_member" => true,
                        "items" => [["product_id" => -1001, "product_sku" => $offlineProduct["sku"] ?? "", "quantity" => 1]],
                    ]),
                    "ignore_errors" => true,
                ],
            ]));
            $offlineOrder = json_decode((string) $offlineBody, true);
            $offlineLine = $offlineOrder["order"]["items"][0] ?? null;
            $check("offline temporary ID replays by SKU", ($offlineOrder["success"] ?? false) === true && is_array($offlineLine) && (int) ($offlineLine["product_id"] ?? 0) > 0 && ($offlineLine["sku"] ?? "") === ($offlineProduct["sku"] ?? ""));

            $sync = $get("/sync?since=0");
            $check("sync works without a token", is_array($sync) && ($sync["success"] ?? false) === true);
            $check("sync exposes a server revision", isset($sync["server_rev"]));
            $check("anonymous sync hides orders", count($sync["orders"] ?? []) === 0);

            $config = $get("/config");
            $check("config exposes the branch name", isset($config["branch"]["branch_name"]));

            $orders = $get("/orders");
            $check("orders require admin", $orders === null || ($orders["success"] ?? true) === false);

            exit($fail === 0 ? 0 : 1);
          '
          echo "Smoke suite passed."
          cat /tmp/php.log | tail -20

  deploy:
    name: Publish to dxn.10001mb.com
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          ready=true
          for value in "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASS"; do
            [ -n "$value" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = true ] || echo "::error::FTP/MySQL secrets are missing. Add them under Settings → Secrets and variables → Actions."

      - name: Write production config from secrets
        if: steps.credentials.outputs.ready == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DXN_ADMIN_KEY: ${{ secrets.DXN_ADMIN_KEY }}
          DXN_INSTALL_KEY: ${{ secrets.DXN_INSTALL_KEY }}
          DXN_TOKEN_SECRET: ${{ secrets.DXN_TOKEN_SECRET }}
        run: |
          mkdir -p api/config
          cat > api/config/config.php <<PHP
          <?php
          return [
              'driver' => 'mysql',
              'db' => [
                  'host' => '${DB_HOST}',
                  'port' => 3306,
                  'name' => '${DB_NAME}',
                  'user' => '${DB_USER}',
                  'pass' => '${DB_PASS}',
                  'charset' => 'utf8mb4',
              ],
              'admin_key' => '${DXN_ADMIN_KEY}',
              'token_secret' => '${DXN_TOKEN_SECRET}',
              'install_key' => '${DXN_INSTALL_KEY}',
              'allowed_origins' => '*',
              'timezone' => 'Asia/Dhaka',
              'debug' => false,
              'version' => '2.2.0',
          ];
          PHP
          php -l api/config/config.php

      # /dxn.10001mb.com/htdocs/api/index.php + install.php + .htaccess
      - name: Upload front controller
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./api/public/
          server-dir: /dxn.10001mb.com/htdocs/api/
          state-name: .ftp-state-public.json
          exclude: |
            **/.ftp-state*.json
            **/router.php

      # /dxn.10001mb.com/htdocs/api/src/**
      - name: Upload application source
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./api/src/
          server-dir: /dxn.10001mb.com/htdocs/api/src/
          state-name: .ftp-state-src.json

      # config.php is generated from repository secrets on every deploy, so the
      # MySQL password is never committed. installed.lock is preserved.
      - name: Upload config
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./api/config/
          server-dir: /dxn.10001mb.com/htdocs/api/config/
          state-name: .ftp-state-config.json
          exclude: |
            **/installed.lock
            **/.ftp-state*.json

      - name: Upload storage guard
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./api/storage/
          server-dir: /dxn.10001mb.com/htdocs/api/storage/
          state-name: .ftp-state-storage.json
          exclude: |
            **/*.sqlite
            **/*.db
            **/*.log
            **/.ftp-state*.json

      # Force-delete CI state so every doc file is re-uploaded (InfinityFree
      # FTP can serve stale files otherwise).
      - name: Reset FTP deploy state
        if: steps.credentials.outputs.ready == 'true'
        run: rm -f .ftp-state-*.json

      # The installable PWA lives at the domain root.
      - name: Upload web app
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./docs/
          server-dir: /dxn.10001mb.com/htdocs/
          state-name: .ftp-state-docs.json
          dangerous-clean-slate: false
          exclude: |
            **/DEPLOYMENT.md
            **/.ftp-state*.json

      # Critical single-file re-upload in case the action skips an unchanged
      # timestamp on a file whose contents changed.
      - name: Force re-upload sw.js
        if: steps.credentials.outputs.ready == 'true'
        run: |
          curl -sS -T docs/sw.js \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/dxn.10001mb.com/htdocs/sw.js" \
            --ftp-pasv

      - name: Install and verify production
        if: steps.credentials.outputs.ready == 'true'
        env:
          DXN_ORIGIN: https://dxn.10001mb.com
          DXN_INSTALL_KEY: ${{ secrets.DXN_INSTALL_KEY }}
          DXN_SHOP_PIN: '2468'
          DXN_BRANCH_NAME: Mohammadpur Stock Point
          DXN_WHATSAPP: '8801939994578'
        run: node scripts/production-install.mjs
