name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dxn-release.jks"
          echo "DXN_KEYSTORE=$RUNNER_TEMP/dxn-release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release + bundle
        working-directory: android/DXNStockpoint
        env:
          DXN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DXN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DXN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          set -e
          mkdir -p dist
          cp android/DXNStockpoint/app/build/outputs/apk/debug/app-debug.apk \
             dist/dxn-stockpoint-2.1.2-debug.apk
          cp dist/dxn-stockpoint-2.1.2-debug.apk dist/dxn-stockpoint-latest.apk
          # Signed release only exists once the keystore secrets are configured.
          if [ -f android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk \
               dist/dxn-stockpoint-2.1.2.apk
          fi
          cp android/DXNStockpoint/app/build/outputs/bundle/release/app-release.aab \
             dist/dxn-stockpoint-2.1.2.aab
          ls -lh dist

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-2.1.2
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.1.2' }}
          name: Mohammadpur Stock Point v2.1.2 — Web + Android, live synced
          body: |
            ## Mohammadpur Stock Point v2.1.2

            Supersedes the earlier v2.0.0 tag: the PHP 8 + MySQL API is the single
            source of truth, and the web app and the Android app both run from it
            with revision-based live sync and an offline outbox.

            **Install the APK:** `dxn-stockpoint-2.1.2-debug.apk` (sideload) or
            upload `dxn-stockpoint-2.1.2.aab` to Google Play.

            **Web app:** https://abraar05.github.io/dxn-stockpoint/

            ### What is in this build
            - Connects out of the box — the live shop API (dxn.infy.click) is the built-in default
            - New Mohammadpur Stock Point logo, app icon and splash artwork
            - The shop's full 2026 DXN price list: 51 SKUs with exact DP/PV/MRP
            - Official DXN product photos for 47 SKUs (bundled offline; 4 use a generated tile)
            - Product image previews in the catalogue, cart and admin screens
            - Shop PIN sign-in (HMAC bearer token, 30-day expiry)
            - Offline-first: cached catalogue, queued sales, automatic replay
            - Idempotent orders (`client_uuid`) — a retry never double-books
            - Incremental sync on a server-wide revision counter
            - Stock ledger, low-stock alerts, dashboard, CSV exports
            - PWA installable web app sharing the exact same data

            ### First run
            1. The app connects to the live shop API automatically
            2. Tap the sync strip until it reads **Live** (only if it is offline)
            3. Unlock Admin with the shop PIN to manage stock and orders
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
